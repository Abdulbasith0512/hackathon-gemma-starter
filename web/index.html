<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Intelligence Copilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M8 23V12l8-5 8 5v11M12 23v-6h8v6' fill='none' stroke='%23f5a524' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="brand" title="Asset Intelligence Copilot">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M7 25V13l9-6 9 6v12M12 25v-7h8v7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </div>
    <button class="rail-btn active" data-view="chat" aria-label="Copilot"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Copilot</span></button>
    <button class="rail-btn" data-view="audit" aria-label="Audit trail"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Audit</span></button>
    <button class="rail-btn" data-view="rules" aria-label="Rules and sources"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 8h8M8 12h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Rules</span></button>
    <button class="rail-btn" data-view="eval" aria-label="Answer verification"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6zM8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Verify</span></button>
    <div class="rail-foot"><span class="dot" id="live-dot" title="Server status"></span></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="title"><h1>Asset Intelligence Copilot</h1><span class="sub" id="dataset-sub">Loading dataset…</span></div>
      <div class="top-actions">
        <button class="chip-btn" id="asof-btn" title="Reference date used for “today”, “right now” and relative periods"><span class="k">As of</span> <span id="asof-val">—</span></button>
        <span class="chip" id="model-chip" title="Model and thinking level"></span>
        <label class="user-pick"><span class="k">Signed in as</span>
          <select id="user-select" aria-label="Select user"></select>
        </label>
      </div>
    </header>

    <section id="view-chat" class="view">
      <aside class="convs" id="convs" aria-label="Your conversations">
        <div class="convs-head"><span>Your chats</span><button class="small" id="new-chat">New chat</button></div>
        <div class="privacy" id="privacy">Private to you</div>
        <ul id="conv-list"></ul>
      </aside>
      <div class="chat">
        <div class="scroll" id="messages" role="log" aria-live="polite"></div>
        <form class="composer" id="composer" autocomplete="off">
          <textarea id="input" rows="1" placeholder="Ask about your wells — e.g. “Which wells are not producing right now, and why?”" aria-label="Ask a question"></textarea>
          <button type="submit" id="send" class="primary" aria-label="Send">Ask</button>
        </form>
        <div class="foot-note">Every answer cites the records and manual passages it used. Numbers are calculated by code, not by the model.</div>
      </div>
    </section>

    <section id="view-audit" class="view page" hidden>
      <div class="page-inner" id="audit-body"></div>
    </section>
    <section id="view-eval" class="view page" hidden>
      <div class="page-inner" id="eval-body"></div>
    </section>
    <section id="view-rules" class="view page" hidden>
      <div class="page-inner" id="rules-body"></div>
    </section>
  </div>

  <aside class="drawer" id="drawer" hidden aria-label="Evidence">
    <div class="drawer-head"><div><div class="eyebrow">Evidence</div><h2 id="drawer-title"></h2><div class="sub" id="drawer-sub"></div></div><button class="icon-btn" id="drawer-close" aria-label="Close evidence">✕</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
